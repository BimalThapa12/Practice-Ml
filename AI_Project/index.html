<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f9;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 95%;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            resize: none;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .output {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height: 120px;
            font-size: 16px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .placeholder {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📧 Email Generator</h2>
        <textarea id="inputText" placeholder="Enter email subject or prompt..."></textarea>
        <button onclick="generate()">Generate Email</button>
        <div class="output" id="output"><span class="placeholder">⚡ Ready to generate email...</span></div>
    </div>

    <script>
        function typeEffect(element, text, speed = 2000, callback = null) {
            element.innerHTML = "";
            let i = 0;
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                } else if (callback) {
                    callback();
                }
            }
            typing();
        }

        async function generate() {
            const inputText = document.getElementById("inputText").value;
            const outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "<span class='placeholder'>⏳ Generating email...</span>";

            try {
                const response = await fetch("http://127.0.0.1:5000/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: inputText })
                });

                if (!response.ok) {
                    throw new Error("Failed to fetch prediction");
                }

                const data = await response.json();

                // Add placeholders around generated text
                const emailText =
                    `Dear Sir/Madam,

${data.generated_text}

Best regards,
Bimal Thapa`;

                // typing animation
                typeEffect(outputDiv, emailText, 5);
            } catch (error) {
                outputDiv.innerHTML = "❌ Error: " + error.message;
            }
        }
    </script>
</body>

</html>
